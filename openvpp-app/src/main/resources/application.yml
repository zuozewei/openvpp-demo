server:
  port: 8080

spring:
  application:
    name: openvpp-demo
  datasource:
    # 教学默认：H2 文件库（读者零外部依赖，重启数据仍在）
    # LOCK_TIMEOUT：同键并发的原子认领在唯一索引上的等待窗口（并发幂等修复见编排器注释）
    url: jdbc:h2:file:${user.home}/.openvpp/openvpp-db;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true   # 教学演示用，生产关闭

# 专栏示例工程统一约定：接口路径前缀，禁止出现真实项目路径风格
openvpp:
  api-prefix: /api/v1
  auth:
    # 教学登录会话 TTL（分钟）：内存 ConcurrentHashMap + 惰性过期（SessionStore），
    # 容器化交付的 Redis 共享会话形态属后续验收篇
    session-ttl-minutes: 30
  gateway:
    # 接入模式：local（默认，本地模拟，零外部依赖，断网可跑）/ remote（真实协议接入）
    # remote 模式下 MQTT 必须显式配置 broker 地址，工程不提供任何默认外部地址
    mode: local
  db:
    # 持久化方言：auto（默认，按连接元数据探测 H2/MySQL）/ mysql / h2（测试显式指定用）
    dialect: auto
  charge:
    # 能力快照有效期（分钟）：评估时间 + 有效期起过期，申报引用过期版本即拒（见 SnapshotRegistry）
    snapshot-ttl-minutes: 480
