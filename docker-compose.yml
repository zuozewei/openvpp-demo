# 专栏第 25 篇：openvpp-demo 一键交付编排
# 一条命令拉起完整演示环境：应用 + MySQL + Redis + EMQX（MQTT broker）
# 应用以 docker profile 启动：业务数据真实落 MySQL（application-docker.yml）；
# Redis 提供已完成结果的幂等快速重放（正确性由数据库唯一约束 + 事务内原子认领兜底）；
# EMQX 承载 remote 模式的 MQTT 协议接入，全部容器网络内互通，不触公网。
# 注意：单容器 java -jar 默认本地模拟模式（零外部依赖），与本编排互不影响。
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENVPP_GATEWAY_MODE: remote
      OPENVPP_MQTT_BROKER: tcp://emqx:1883
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: openvpp_demo
      MYSQL_USER: root
      MYSQL_PASSWORD: openvpp-demo
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: openvpp-demo
      MYSQL_DATABASE: openvpp_demo
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  emqx:
    image: emqx:5
    ports:
      - "1883:1883"     # MQTT
      - "18083:18083"   # 控制台
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: openvpp
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
